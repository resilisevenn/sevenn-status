<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sevenn Clinic 360 — Status</title>
<meta name="description" content="Disponibilidade em tempo real dos serviços do Sevenn Clinic 360." />
<style>
  :root {
    --bg: #f7faf9;
    --bg-raised: #ffffff;
    --ink: #12211d;
    --ink-soft: #4b615c;
    --line: #d9e4e0;
    --accent: #1c7c54;
    --accent-soft: #e3f3ea;
    --up: #1c7c54;
    --degraded: #b8842e;
    --degraded-soft: #fbf1de;
    --down: #c1442e;
    --down-soft: #fbe9e5;
    --mono: "SFMono-Regular", "JetBrains Mono", Consolas, "Liberation Mono", Menlo, monospace;
    --serif: Iowan, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1210;
      --bg-raised: #121b18;
      --ink: #e7f1ed;
      --ink-soft: #93a8a2;
      --line: #24332e;
      --accent: #3fbf8a;
      --accent-soft: #14231d;
      --up: #3fbf8a;
      --degraded: #d6a256;
      --degraded-soft: #2a2015;
      --down: #e2685a;
      --down-soft: #2a1714;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0b1210;
    --bg-raised: #121b18;
    --ink: #e7f1ed;
    --ink-soft: #93a8a2;
    --line: #24332e;
    --accent: #3fbf8a;
    --accent-soft: #14231d;
    --up: #3fbf8a;
    --degraded: #d6a256;
    --degraded-soft: #2a2015;
    --down: #e2685a;
    --down-soft: #2a1714;
  }

  :root[data-theme="light"] {
    --bg: #f7faf9;
    --bg-raised: #ffffff;
    --ink: #12211d;
    --ink-soft: #4b615c;
    --line: #d9e4e0;
    --accent: #1c7c54;
    --accent-soft: #e3f3ea;
    --up: #1c7c54;
    --degraded: #b8842e;
    --degraded-soft: #fbf1de;
    --down: #c1442e;
    --down-soft: #fbe9e5;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 4rem 1.5rem 6rem;
  }

  header.page-head {
    margin-bottom: 2.5rem;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 0.6rem;
  }

  h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(1.7rem, 4vw, 2.35rem);
    line-height: 1.15;
    margin: 0 0 0.5rem;
    text-wrap: balance;
    color: var(--ink);
  }

  .lede {
    font-size: 0.98rem;
    color: var(--ink-soft);
    margin: 0;
    max-width: 46ch;
  }

  /* ---- Global status banner ---- */
  .global-status {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem 1.25rem;
    border-radius: 999px;
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 2.75rem;
    border: 1px solid transparent;
  }
  .global-status .dot {
    width: 0.6rem;
    height: 0.6rem;
    border-radius: 50%;
    flex: none;
  }
  .global-status.state-up {
    background: var(--accent-soft);
    color: var(--up);
    border-color: color-mix(in srgb, var(--up) 25%, transparent);
  }
  .global-status.state-up .dot { background: var(--up); }
  .global-status.state-degraded {
    background: var(--degraded-soft);
    color: var(--degraded);
    border-color: color-mix(in srgb, var(--degraded) 30%, transparent);
  }
  .global-status.state-degraded .dot { background: var(--degraded); }
  .global-status.state-down {
    background: var(--down-soft);
    color: var(--down);
    border-color: color-mix(in srgb, var(--down) 30%, transparent);
  }
  .global-status.state-down .dot { background: var(--down); }

  /* ---- Period selector ---- */
  .period-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    margin-bottom: 1.1rem;
  }

  .period-label {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .period-tabs {
    display: inline-flex;
    gap: 2px;
    padding: 3px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  .period-tabs button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-family: var(--mono);
    font-size: 0.76rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 0.35rem 0.7rem;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .period-tabs button:hover {
    color: var(--ink);
  }

  .period-tabs button[aria-pressed="true"] {
    background: var(--accent);
    color: var(--bg-raised);
  }

  /* ---- Services list ---- */
  .services {
    display: flex;
    flex-direction: column;
    gap: 0;
    border-top: 1px solid var(--line);
  }

  .service-row {
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-areas:
      "name stripe"
      "meta stripe";
    align-items: center;
    gap: 0.2rem 1.5rem;
    padding: 1.35rem 0.25rem;
    border-bottom: 1px solid var(--line);
  }

  .service-name-row {
    grid-area: name;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .state-chip {
    font-family: var(--mono);
    font-size: 0.66rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0.18rem 0.5rem;
    border-radius: 4px;
    font-weight: 600;
  }
  .state-chip.state-up { background: var(--accent-soft); color: var(--up); }
  .state-chip.state-degraded { background: var(--degraded-soft); color: var(--degraded); }
  .state-chip.state-down { background: var(--down-soft); color: var(--down); }

  .service-name {
    font-size: 1.02rem;
    font-weight: 600;
    color: var(--ink);
  }

  .service-meta {
    grid-area: meta;
    display: flex;
    gap: 1.1rem;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 0.78rem;
    color: var(--ink-soft);
  }

  .service-meta .metric b {
    color: var(--ink);
    font-weight: 600;
  }

  .stripe {
    grid-area: stripe;
    display: flex;
    gap: 2px;
    align-items: flex-end;
    height: 34px;
  }
  .stripe .bar {
    width: 5px;
    border-radius: 1px;
    background: var(--line);
  }
  .stripe .bar.up { background: var(--up); opacity: 0.85; }
  .stripe .bar.degraded { background: var(--degraded); }
  .stripe .bar.down { background: var(--down); }

  footer.page-foot {
    margin-top: 3rem;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem;
    font-size: 0.8rem;
    color: var(--ink-soft);
  }
  footer.page-foot a {
    color: var(--ink-soft);
    text-decoration: underline;
    text-decoration-color: var(--line);
    text-underline-offset: 3px;
  }
  footer.page-foot a:hover { color: var(--accent); }

  .loading, .error-state {
    font-family: var(--mono);
    font-size: 0.85rem;
    color: var(--ink-soft);
    padding: 2rem 0;
  }

  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="page-head">
      <p class="eyebrow">Sevenn Clinic 360</p>
      <h1>Status dos serviços</h1>
      <p class="lede">Disponibilidade em tempo real do CRM e da infraestrutura de backend, atualizado a cada poucos minutos.</p>
    </header>

    <div id="global-status" class="global-status" role="status">
      <span class="dot"></span>
      <span id="global-status-text">Carregando status…</span>
    </div>

    <div class="period-bar">
      <span class="period-label">Período</span>
      <div class="period-tabs" id="period-tabs" role="tablist" aria-label="Selecionar período de disponibilidade">
        <button type="button" data-period="Day" aria-pressed="false">24h</button>
        <button type="button" data-period="Week" aria-pressed="true">7d</button>
        <button type="button" data-period="Month" aria-pressed="false">30d</button>
        <button type="button" data-period="Year" aria-pressed="false">1a</button>
      </div>
    </div>

    <section class="services" id="services" aria-label="Lista de serviços monitorados">
      <p class="loading">Buscando dados de disponibilidade…</p>
    </section>

    <footer class="page-foot">
      <span id="last-updated"></span>
      <a href="https://github.com/resilisevenn/sevenn-status" target="_blank" rel="noopener">Histórico completo no GitHub</a>
    </footer>
  </div>

<script>
  const DATA_URL = "https://raw.githubusercontent.com/resilisevenn/sevenn-status/main/history/summary.json";

  const stateLabel = { up: "Operacional", degraded: "Instável", down: "Fora do ar" };

  // Quantos dias do histórico diário (dailyMinutesDown) mostrar na faixa de
  // pulso, por período selecionado. 24h ainda usa dias (é a granularidade
  // que o Upptime grava), mas exibe uma janela mais curta e recente.
  const PERIOD_STRIPE_DAYS = { Day: 7, Week: 14, Month: 30, Year: 90 };
  const PERIOD_TITLE = { Day: "últimas 24 horas", Week: "últimos 7 dias", Month: "últimos 30 dias", Year: "último ano" };

  let currentPeriod = "Week";
  let latestSites = [];

  function classify(site, period) {
    if (site.status === "down") return "down";
    const uptime = parseFloat(site[`uptime${period}`] ?? site.uptime ?? "100");
    if (site.status === "up" && uptime < 99.5) return "degraded";
    return "up";
  }

  function buildStripe(site, period) {
    // dailyMinutesDown é um mapa {data: minutos-fora}; a janela de dias
    // exibida cresce com o período selecionado (24h mostra menos, 1a mostra mais).
    const days = PERIOD_STRIPE_DAYS[period];
    const downMap = site.dailyMinutesDown || {};
    const dates = Object.keys(downMap).sort();
    const bars = [];
    for (let i = 0; i < days; i++) {
      const key = dates[dates.length - (days - i)];
      const minutesDown = key ? downMap[key] : 0;
      let state = "up";
      if (minutesDown > 60) state = "down";
      else if (minutesDown > 0) state = "degraded";
      bars.push({ state, date: key });
    }
    return bars;
  }

  function renderService(site, period) {
    const state = classify(site, period);
    const uptime = site[`uptime${period}`] ?? site.uptime ?? "—";
    const time = site[`time${period}`] ?? site.time;
    const bars = buildStripe(site, period)
      .map(({ state: s, date }) => {
        const height = s === "up" ? 100 : s === "degraded" ? 60 : 30;
        const title = date ? `${date}: ${stateLabel[s]}` : "sem dados";
        return `<span class="bar ${s}" style="height:${height}%" title="${title}"></span>`;
      })
      .join("");

    return `
      <div class="service-row">
        <div class="service-name-row">
          <span class="service-name">${site.name}</span>
          <span class="state-chip state-${state}">${stateLabel[state]}</span>
        </div>
        <div class="service-meta">
          <span class="metric">uptime <b>${uptime}</b></span>
          <span class="metric">resposta <b>${time ?? "—"}ms</b></span>
        </div>
        <div class="stripe" aria-hidden="true">${bars}</div>
      </div>
    `;
  }

  function renderGlobal(sites, period) {
    const el = document.getElementById("global-status");
    const text = document.getElementById("global-status-text");
    const anyDown = sites.some((s) => classify(s, period) === "down");
    const anyDegraded = sites.some((s) => classify(s, period) === "degraded");
    let state = "up";
    let label = "Todos os serviços operacionais";
    if (anyDown) { state = "down"; label = "Um ou mais serviços estão fora do ar"; }
    else if (anyDegraded) { state = "degraded"; label = `Desempenho degradado (${PERIOD_TITLE[period]})`; }
    el.className = `global-status state-${state}`;
    text.textContent = label;
  }

  function renderAll() {
    if (!latestSites.length) return;
    renderGlobal(latestSites, currentPeriod);
    document.getElementById("services").innerHTML =
      latestSites.map((site) => renderService(site, currentPeriod)).join("");
  }

  function setupPeriodTabs() {
    const tabs = document.getElementById("period-tabs");
    tabs.addEventListener("click", (ev) => {
      const btn = ev.target.closest("button[data-period]");
      if (!btn) return;
      currentPeriod = btn.dataset.period;
      tabs.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
      renderAll();
    });
  }

  async function load() {
    try {
      const res = await fetch(DATA_URL, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      latestSites = await res.json();

      renderAll();
      document.getElementById("last-updated").textContent =
        "Última verificação: " + new Date().toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });
    } catch (err) {
      document.getElementById("services").innerHTML =
        `<p class="error-state">Não foi possível carregar os dados de status agora. Tente novamente em instantes.</p>`;
      document.getElementById("global-status-text").textContent = "Status indisponível no momento";
    }
  }

  setupPeriodTabs();
  load();
  setInterval(load, 60000);
</script>
</body>
</html>

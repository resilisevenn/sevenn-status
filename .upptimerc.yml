# Change these first
owner: resilisevenn
repo: sevenn-status

sites:
  - name: App Frontend
    url: https://app.sevennclinic360.com
    method: GET
    # Se não responder em 30s, considera fora do ar e segue para o próximo check.
    # Sem isso, um endpoint pendurado trava o job inteiro até o timeout de 15min
    # do Upptime, o que impede a checagem dos demais sites e gera um e-mail
    # "workflow cancelled" em vez do alerta correto de "down".
    # Incidente de 2026-08-06 (runs Uptime CI #221 e #222, 15min cravados).
    maxResponseTime: 30000
    expectedStatusCodes:
      - 200

  # ATENÇÃO: este check NÃO toca no banco — só confirma que a infra de Edge
  # Functions responde. Mantido separado do "Banco de dados" de propósito: com
  # os dois, o histórico distingue "Edge Functions fora" de "Postgres fora".
  - name: Edge Functions (health)
    url: https://degdbpstlcrmpibtqwiy.supabase.co/functions/v1/health
    method: GET
    maxResponseTime: 30000
    expectedStatusCodes:
      - 200

  # Executa um SELECT 1 real no Postgres (RPC health_check, migration 190) e
  # devolve 503 se falhar ou passar de 8s.
  # POR QUE EXISTE: em 21/set/2026 o Postgres caiu por OOM e ficou ~35min
  # inacessível — e esta página ficou VERDE o tempo todo, porque os dois checks
  # que existiam eram justamente os que não quebraram (o frontend servia HTML
  # normalmente e o /health devolve JSON fixo sem consultar nada).
  - name: Banco de dados
    url: https://degdbpstlcrmpibtqwiy.supabase.co/functions/v1/health-db
    method: GET
    maxResponseTime: 30000
    expectedStatusCodes:
      - 200

  # O /auth/v1/token dava 504 e deslogava usuários no mesmo incidente.
  # O header apikey é OBRIGATÓRIO: sem ele o endpoint devolve 401 (testado em
  # 22/set/2026), o que marcaria "down" falso permanente.
  - name: Autenticação
    url: https://degdbpstlcrmpibtqwiy.supabase.co/auth/v1/health
    method: GET
    maxResponseTime: 30000
    headers:
      - "apikey: $SUPABASE_ANON_KEY"
    expectedStatusCodes:
      - 200

  # Os 3 workers rodam no EasyPanel, fora do Supabase. Cada um expõe /health na
  # porta 3001, protegido por x-health-token (sem o header responde 404, para não
  # revelar a rota). O critério é loop girando E banco alcançável: até 22/set dois
  # deles se diziam saudáveis só por o loop girar, e passaram o incidente de 21/set
  # repetindo "upstream request timeout" enquanto reportavam "ok".
  - name: Worker — Automações
    url: https://sevenn-front-sevenn-automation-worker.0bio7m.easypanel.host/health
    method: GET
    maxResponseTime: 30000
    headers:
      - "x-health-token: $HEALTH_CHECK_TOKEN"
    expectedStatusCodes:
      - 200

  - name: Worker — Motor de Workflow
    url: https://sevenn-front-sevenn-workflow-engine-worker.0bio7m.easypanel.host/health
    method: GET
    maxResponseTime: 30000
    headers:
      - "x-health-token: $HEALTH_CHECK_TOKEN"
    expectedStatusCodes:
      - 200

  - name: Worker — Sincronização WhatsApp
    url: https://sevenn-front-wpp-sync-worker.0bio7m.easypanel.host/health
    method: GET
    maxResponseTime: 30000
    headers:
      - "x-health-token: $HEALTH_CHECK_TOKEN"
    expectedStatusCodes:
      - 200

status-website:
  # Domínio próprio: crie um CNAME no DNS apontando para resilisevenn.github.io
  cname: status.sevennclinic360.com
  name: Sevenn Clinic 360 — Status
  introTitle: "Status dos serviços Sevenn Clinic 360"
  introMessage: Acompanhe em tempo real a disponibilidade dos serviços do Sevenn Clinic 360.
  navbar:
    - title: Status
      href: /
    - title: Site
      href: https://app.sevennclinic360.com

# Upptime também suporta notificações, atribuição de issues, e mais
# Ver https://upptime.js.org/docs/configuration
